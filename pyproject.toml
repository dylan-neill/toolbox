[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolbox"
version = "0.6.0"
description = "A launcher for DCC software that runs applications inside versioned Rez environments."
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Dylan Neill" }]
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.11.2",
    "pywin32>=311; sys_platform == 'win32'",
]

# GUI entry point: on Windows this launches via pythonw (no stray console
# window), matching the taskbar-icon setup in toolbox/__main__.py.
[project.gui-scripts]
toolbox = "toolbox.__main__:main"

[dependency-groups]
dev = [
    "briefcase>=0.3.20",
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
